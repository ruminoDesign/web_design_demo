<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eugene Bio</title>
  <style>
    html, body {
      margin: 0;
      background: #ffffff;
    }
    main {
      min-height: 100vh;
      box-sizing: border-box;
      padding: 6vh 4vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 5vh, 64px);
    }
    img {
      display: block;
      height: auto;
    }
    /* 로고: 원본 1046 x 344, 화면 폭에 맞춰 조절 (원본보다 커지지 않음) */
    .logo {
      width: min(70vw, 1046px);
    }
    /* 세계지도: 원본 1400 x 747, 화면 폭에 맞춰 조절 (원본보다 커지지 않음) */
    .map {
      width: min(92vw, 1400px);
    }
    @media (max-width: 600px) {
      .logo { width: 88vw; }
      .map  { width: 100vw; }
      main  { padding: 8vh 0; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="eugene_bio_logo_anim.gif" width="1046" height="344"
         alt="Eugene Bio - Animal Health & Nutrition">
    <img class="map" src="world_map_anime.gif" width="1400" height="747"
         alt="Eugene Bio 글로벌 네트워크 지도">
  </main>
</body>
</html>
