<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Map</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 원본 1400 x 747 비율 유지, 브라우저 크기에 맞춰 늘거나 줄어듦 */
    .map {
      width: min(100vw, calc(100vh * 1400 / 747));
      aspect-ratio: 1400 / 747;
    }
    .map img {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="map">
    <img src="world_map_anime.gif" width="1400" height="747" alt="Eugene Bio 글로벌 네트워크 지도">
  </div>
</body>
</html>
